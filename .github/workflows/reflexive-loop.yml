name: Reflexive loop conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'

      - name: Observe Go runtime
        run: go version

      - name: Download pinned Gooo release
        shell: bash
        run: |
          set -euo pipefail
          lock="$GITHUB_WORKSPACE/contracts/gooo-release-lock-v1.json"
          repository=$(jq -r '.repository' "$lock")
          tag=$(jq -r '.tag' "$lock")
          expected_tag_object=$(jq -r '.tag_object_sha' "$lock")
          expected_target=$(jq -r '.target_commit_sha' "$lock")
          asset_name=$(jq -r '.assets[0].name' "$lock")
          expected_digest=$(jq -r '.assets[0].sha256' "$lock")

          gh api "repos/$repository/git/ref/tags/$tag" > "$RUNNER_TEMP/tag-ref.json"
          jq -e --arg sha "$expected_tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/tag-ref.json" >/dev/null
          gh api "repos/$repository/git/tags/$expected_tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq -e --arg sha "$expected_target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/tag-object.json" >/dev/null
          gh api "repos/$repository/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          asset_id=$(jq -r --arg name "$asset_name" '.assets[]|select(.name==$name)|.id' "$RUNNER_TEMP/release.json")
          test -n "$asset_id"
          archive="$RUNNER_TEMP/$asset_name"
          gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$archive"
          printf '%s  %s\n' "$expected_digest" "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gooo"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gooo"
          chmod +x "$RUNNER_TEMP/gooo/gooo"
          echo "GOOO_BIN=$RUNNER_TEMP/gooo/gooo" >> "$GITHUB_ENV"

      - name: Download exact external release inputs
        shell: bash
        run: |
          set -euo pipefail
          lock="$GITHUB_WORKSPACE/contracts/external-release-locks-v1.json"
          external="$RUNNER_TEMP/gooo-reflexive-loop-external-inputs"
          mkdir -p "$external"

          fetch_release_asset() {
            local release_file=$1
            local repository=$2
            local asset_name=$3
            local expected_digest=$4
            local expected_size=$5
            local output=$6
            local asset_id
            local asset_digest
            local asset_size
            asset_id=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].id // empty' "$release_file")
            test -n "$asset_id"
            asset_digest=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].digest // empty' "$release_file")
            asset_size=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].size // empty' "$release_file")
            test "$asset_digest" = "$expected_digest"
            test "$asset_size" -eq "$expected_size"
            gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$output"
            printf '%s  %s\n' "${expected_digest#sha256:}" "$output" | sha256sum -c -
            test "$(wc -c < "$output" | awk '{print $1 + 0}')" -eq "$expected_size"
          }

          fetch_public_release_asset() {
            local release_file=$1
            local repository=$2
            local asset_name=$3
            local expected_digest=$4
            local expected_size=$5
            local output=$6
            local asset_id
            local asset_digest
            local asset_size
            asset_id=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].id // empty' "$release_file")
            test -n "$asset_id"
            asset_digest=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].digest // empty' "$release_file")
            asset_size=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].size // empty' "$release_file")
            test "$asset_digest" = "$expected_digest"
            test "$asset_size" -eq "$expected_size"
            GH_TOKEN="" gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$output"
            printf '%s  %s\n' "${expected_digest#sha256:}" "$output" | sha256sum -c -
            test "$(wc -c < "$output" | awk '{print $1 + 0}')" -eq "$expected_size"
          }

          budget_repo=$(jq -r '.releases.meta_budget.repository' "$lock")
          budget_tag=$(jq -r '.releases.meta_budget.tag' "$lock")
          budget_target=$(jq -r '.releases.meta_budget.target_commit_sha' "$lock")
          budget_manifest_name=$(jq -r '.releases.meta_budget.manifest.asset_name' "$lock")
          budget_manifest_size=$(jq -r '.releases.meta_budget.manifest.size_bytes' "$lock")
          budget_manifest_digest=$(jq -r '.releases.meta_budget.manifest.sha256' "$lock")
          budget_evidence_name=$(jq -r '.releases.meta_budget.evidence.asset_name' "$lock")
          budget_evidence_digest=$(jq -r '.releases.meta_budget.evidence.sha256' "$lock")
          budget_evidence_size=$(jq -r '.releases.meta_budget.evidence.size_bytes' "$lock")
          gh api "repos/$budget_repo/releases/tags/$budget_tag" > "$external/budget-release.json"
          jq -e --arg tag "$budget_tag" --arg target "$budget_target" \
            '.immutable==true and .tag_name==$tag and .target_commitish==$target' \
            "$external/budget-release.json" >/dev/null
          fetch_release_asset "$external/budget-release.json" "$budget_repo" "$budget_manifest_name" "$budget_manifest_digest" "$budget_manifest_size" "$external/budget-manifest.json"
          fetch_release_asset "$external/budget-release.json" "$budget_repo" "$budget_evidence_name" "$budget_evidence_digest" "$budget_evidence_size" "$external/budget-evidence.tar.gz"

          lattice_repo=$(jq -r '.releases.resolution_lattice.repository' "$lock")
          lattice_tag=$(jq -r '.releases.resolution_lattice.tag' "$lock")
          lattice_target=$(jq -r '.releases.resolution_lattice.target_commit_sha' "$lock")
          lattice_manifest_name=$(jq -r '.releases.resolution_lattice.manifest.asset_name' "$lock")
          lattice_manifest_size=$(jq -r '.releases.resolution_lattice.manifest.size_bytes' "$lock")
          lattice_manifest_digest=$(jq -r '.releases.resolution_lattice.manifest.sha256' "$lock")
          lattice_evidence_name=$(jq -r '.releases.resolution_lattice.evidence.asset_name' "$lock")
          lattice_evidence_digest=$(jq -r '.releases.resolution_lattice.evidence.sha256' "$lock")
          lattice_evidence_size=$(jq -r '.releases.resolution_lattice.evidence.size_bytes' "$lock")
          gh api "repos/$lattice_repo/releases/tags/$lattice_tag" > "$external/lattice-release.json"
          jq -e --arg tag "$lattice_tag" --arg target "$lattice_target" \
            '.immutable==true and .tag_name==$tag and .target_commitish==$target' \
            "$external/lattice-release.json" >/dev/null
          fetch_release_asset "$external/lattice-release.json" "$lattice_repo" "$lattice_manifest_name" "$lattice_manifest_digest" "$lattice_manifest_size" "$external/lattice-manifest.json"
          fetch_release_asset "$external/lattice-release.json" "$lattice_repo" "$lattice_evidence_name" "$lattice_evidence_digest" "$lattice_evidence_size" "$external/lattice-evidence.zip"

          causal_repo=$(jq -r '.releases.causal_ci.repository' "$lock")
          causal_tag=$(jq -r '.releases.causal_ci.tag' "$lock")
          causal_target=$(jq -r '.releases.causal_ci.target_commit_sha' "$lock")
          causal_manifest_name=$(jq -r '.releases.causal_ci.manifest.asset_name' "$lock")
          causal_manifest_size=$(jq -r '.releases.causal_ci.manifest.size_bytes' "$lock")
          causal_manifest_digest=$(jq -r '.releases.causal_ci.manifest.sha256' "$lock")
          causal_evidence_name=$(jq -r '.releases.causal_ci.evidence.asset_name' "$lock")
          causal_evidence_digest=$(jq -r '.releases.causal_ci.evidence.sha256' "$lock")
          causal_evidence_size=$(jq -r '.releases.causal_ci.evidence.size_bytes' "$lock")
          causal_checksum_name=$(jq -r '.releases.causal_ci.checksum.asset_name' "$lock")
          causal_checksum_digest=$(jq -r '.releases.causal_ci.checksum.sha256' "$lock")
          causal_checksum_size=$(jq -r '.releases.causal_ci.checksum.size_bytes' "$lock")
          GH_TOKEN="" gh api "repos/$causal_repo/releases/tags/$causal_tag" > "$external/causal-release.json"
          jq -e --arg tag "$causal_tag" '.immutable==true and .tag_name==$tag' "$external/causal-release.json" >/dev/null
          fetch_public_release_asset "$external/causal-release.json" "$causal_repo" "$causal_manifest_name" "$causal_manifest_digest" "$causal_manifest_size" "$external/causal-manifest.json"
          if ! GH_TOKEN="" gh api "repos/$causal_repo/git/ref/tags/$causal_tag" > "$external/causal-tag-ref.json"; then
            jq -e --arg target "$causal_target" '.release.target_commit==$target' "$external/causal-manifest.json" >/dev/null
            jq -S -n --arg tag "$causal_tag" --arg target "$causal_target" \
              '{ref:("refs/tags/" + $tag),object:{type:"commit",sha:$target},derived_from:"immutable-consumer-manifest.release.target_commit"}' > "$external/causal-tag-ref.json"
          fi
          jq -e --arg target "$causal_target" '.object.type=="commit" and .object.sha==$target' "$external/causal-tag-ref.json" >/dev/null
          fetch_public_release_asset "$external/causal-release.json" "$causal_repo" "$causal_evidence_name" "$causal_evidence_digest" "$causal_evidence_size" "$external/causal-evidence.tar.gz"
          fetch_public_release_asset "$external/causal-release.json" "$causal_repo" "$causal_checksum_name" "$causal_checksum_digest" "$causal_checksum_size" "$external/causal-checksum.txt"

          denominator_repo=$(jq -r '.releases.denominator_protocol.repository' "$lock")
          denominator_tag=$(jq -r '.releases.denominator_protocol.tag' "$lock")
          denominator_target=$(jq -r '.releases.denominator_protocol.target_commit_sha' "$lock")
          denominator_manifest_name=$(jq -r '.releases.denominator_protocol.manifest.asset_name' "$lock")
          denominator_manifest_size=$(jq -r '.releases.denominator_protocol.manifest.size_bytes' "$lock")
          denominator_manifest_digest=$(jq -r '.releases.denominator_protocol.manifest.sha256' "$lock")
          denominator_evidence_name=$(jq -r '.releases.denominator_protocol.evidence.asset_name' "$lock")
          denominator_evidence_digest=$(jq -r '.releases.denominator_protocol.evidence.sha256' "$lock")
          denominator_evidence_size=$(jq -r '.releases.denominator_protocol.evidence.size_bytes' "$lock")
          denominator_checksum_name=$(jq -r '.releases.denominator_protocol.checksum.asset_name' "$lock")
          denominator_checksum_digest=$(jq -r '.releases.denominator_protocol.checksum.sha256' "$lock")
          denominator_checksum_size=$(jq -r '.releases.denominator_protocol.checksum.size_bytes' "$lock")
          GH_TOKEN="" gh api "repos/$denominator_repo/releases/tags/$denominator_tag" > "$external/denominator-release.json"
          jq -e --arg tag "$denominator_tag" --arg target "$denominator_target" '.immutable==true and .tag_name==$tag and .target_commitish==$target' "$external/denominator-release.json" >/dev/null
          fetch_public_release_asset "$external/denominator-release.json" "$denominator_repo" "$denominator_manifest_name" "$denominator_manifest_digest" "$denominator_manifest_size" "$external/denominator-manifest.json"
          if ! GH_TOKEN="" gh api "repos/$denominator_repo/git/ref/tags/$denominator_tag" > "$external/denominator-tag-ref.json"; then
            jq -e --arg target "$denominator_target" '.target_commit==$target' "$external/denominator-manifest.json" >/dev/null
            jq -S -n --arg tag "$denominator_tag" --arg target "$denominator_target" \
              '{ref:("refs/tags/" + $tag),object:{type:"commit",sha:$target},derived_from:"immutable-consumer-manifest.target_commit"}' > "$external/denominator-tag-ref.json"
          fi
          jq -e --arg target "$denominator_target" '.object.type=="commit" and .object.sha==$target' "$external/denominator-tag-ref.json" >/dev/null
          fetch_public_release_asset "$external/denominator-release.json" "$denominator_repo" "$denominator_evidence_name" "$denominator_evidence_digest" "$denominator_evidence_size" "$external/denominator-evidence.tar.gz"
          fetch_public_release_asset "$external/denominator-release.json" "$denominator_repo" "$denominator_checksum_name" "$denominator_checksum_digest" "$denominator_checksum_size" "$external/denominator-checksum.txt"

      - name: Run all loop scenarios
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gooo-reflexive-loop-evidence"
          mkdir -p "$evidence"
          build_start_ns=$(date +%s%N)
          /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/build-time.tsv" \
            "$GOOO_BIN" graph dump "$GITHUB_WORKSPACE/examples/reflexive-loop/main.gooo" > "$RUNNER_TEMP/build-graph.json"
          build_end_ns=$(date +%s%N)
          build_wall_ms=$(( (build_end_ns - build_start_ns) / 1000000 ))
          read -r build_seconds build_rss < "$RUNNER_TEMP/build-time.tsv"
          test_start_ns=$(date +%s%N)
          /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/test-time.tsv" \
            "$GOOO_BIN" check --semantic --json "$GITHUB_WORKSPACE/fixtures/use-case/workload.gooo" > "$RUNNER_TEMP/test.json"
          test_end_ns=$(date +%s%N)
          test_wall_ms=$(( (test_end_ns - test_start_ns) / 1000000 ))
          read -r test_seconds test_rss < "$RUNNER_TEMP/test-time.tsv"
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/conformance-time.tsv" \
            bash scripts/conform.sh "$GOOO_BIN" "$GITHUB_WORKSPACE" "$evidence"
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns - start_ns) / 1000000 ))
          read -r seconds rss < "$RUNNER_TEMP/conformance-time.tsv"
          conformance_rss=${rss:-0}
          jq -S --argjson wall_ms "$wall_ms" --argjson rss "$conformance_rss" \
            --argjson build_wall_ms "$build_wall_ms" --argjson build_rss "${build_rss:-0}" \
            --argjson test_wall_ms "$test_wall_ms" --argjson test_rss "${test_rss:-0}" \
            '.performance={build_wall_ms:$build_wall_ms,build_peak_rss_kib:$build_rss,test_wall_ms:$test_wall_ms,test_peak_rss_kib:$test_rss,conformance_wall_ms:$wall_ms,conformance_peak_rss_kib:$rss}' \
            "$evidence/conformance.json" > "$RUNNER_TEMP/conformance.json"
          mv "$RUNNER_TEMP/conformance.json" "$evidence/conformance.json"
          jq -S --argjson wall_ms "$wall_ms" --argjson rss "$conformance_rss" \
            --argjson build_wall_ms "$build_wall_ms" --argjson build_rss "${build_rss:-0}" \
            --argjson test_wall_ms "$test_wall_ms" --argjson test_rss "${test_rss:-0}" \
            '.performance.build_wall_ms=$build_wall_ms | .performance.build_peak_rss_kib=$build_rss | .performance.test_wall_ms=$test_wall_ms | .performance.test_peak_rss_kib=$test_rss | .performance.conformance_wall_ms=$wall_ms | .performance.conformance_peak_rss_kib=$rss' \
            "$evidence/scenarios/normal/ci-artifact.json" > "$RUNNER_TEMP/normal-ci-artifact.json"
          mv "$RUNNER_TEMP/normal-ci-artifact.json" "$evidence/scenarios/normal/ci-artifact.json"
          bash scripts/integration-conform.sh "$GOOO_BIN" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gooo-reflexive-loop-external-inputs" "$evidence/integration"
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/causal-denominator-conformance-time.tsv" \
            bash scripts/causal-denominator-conform.sh "$GOOO_BIN" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gooo-reflexive-loop-external-inputs" "$evidence/causal-denominator"
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns - start_ns) / 1000000 ))
          read -r seconds rss < "$RUNNER_TEMP/causal-denominator-conformance-time.tsv"
          jq -S --argjson wall_ms "$wall_ms" --argjson rss "${rss:-0}" \
            '.performance={conformance_wall_ms:$wall_ms,conformance_peak_rss_kib:$rss}' \
            "$evidence/causal-denominator/causal-denominator-conformance.json" > "$RUNNER_TEMP/causal-denominator-conformance.json"
          mv "$RUNNER_TEMP/causal-denominator-conformance.json" "$evidence/causal-denominator/causal-denominator-conformance.json"

      - name: Check human-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gooo-reflexive-loop-evidence"
          jq -e '
            .schema=="gooo/reflexive-loop/conformance/v1" and
            .tests=={executed:9,reused:0,skipped:0} and
            ([.scenarios[].decision]|sort)==["FAIL_CLOSED","FAIL_CLOSED","FAIL_CLOSED","FAIL_CLOSED","FAIL_CLOSED","FAIL_CLOSED","FAIL_CLOSED","PROMOTED","UNKNOWN"] and
            .performance.conformance_wall_ms >= 0 and .performance.conformance_peak_rss_kib >= 0
          ' "$evidence/conformance.json" >/dev/null
          jq -e '
            .schema=="gooo/reflexive-loop/ci-artifact/v1" and
            .decision=="PROMOTED" and .summary=={total:18,closed:18,unknown:0,refuted:0,direct_missing:0,dependency_blocked:0} and
            .repository_unchanged==true and .repository_writes==0 and
            .artifact.files>0 and .artifact.bytes>0 and
            .performance.before.wall_ms>=0 and .performance.after.wall_ms>=0 and
            (.metrics|length)==18 and .bindings.one_to_one==true
          ' "$evidence/scenarios/normal/ci-artifact.json" >/dev/null
          jq -e 'all(.metrics[]; .denominator==1 and (.numerator|type)=="number" and .activity != null and .source_file=="examples/reflexive-loop/main.gooo" and .ir_node_kind=="Activity" and .generated_artifact != null and .evaluator != null)' "$evidence/scenarios/normal/ci-artifact.json" >/dev/null
          cat "$evidence/scenarios/normal/ci-artifact.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '
            .schema=="gooo/reflexive-loop/integrated-conformance/v1" and
            .tests=={executed:6,reused:0,skipped:0} and
            .cross_project_required_gates==0 and
            .precedence==["REFUTED","UNKNOWN","CLOSED"] and
            ([.scenarios[].decision]|sort)==["CLOSED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED"] and
            .normal_external_unknown.state=="UNKNOWN" and .normal_external_unknown.preserved_exactly==true
          ' "$evidence/integration/integrated-conformance.json" >/dev/null
          jq -e '
            .schema=="gooo/reflexive-loop/integrated-ci-artifact/v1" and
            .scenario=="normal" and .decision=="CLOSED" and
            .summary=={total:8,closed:8,unknown:0,refuted:0} and
            .execution_plan.selected_operation=="reuse-verified-evidence" and
            .execution_plan.deferred_operation=="defer-conformance-replay" and
            .execution_plan.privilege_level=="read-only" and
            .resolution_unknown=={metric:"performance/utility",state:"UNKNOWN",stage:"IMPROVEMENT",step:"REQUIRE_EXACT_BEFORE_AFTER_PAIR",reason:"EXACT_BEFORE_AFTER_PAIR_MISSING",unknown_class:"CAUSALITY_UNPROVEN",next_operation:"PROVIDE_EXACT_BEFORE_AFTER_PAIR",blocked_by:["exact-before-after-pair"],preserved_exactly:true} and
            .lifecycle.promotion=="PROMOTED" and .lifecycle.rollback.repository_writes==0 and
            .authority=={repository_writes:0,cross_project_required_gates:0,input_repository_unchanged:true,local_tests_run:0} and
            .bindings.external_inputs_affect_proposal==true and .bindings.execution_plan_affects_apply==true and
            .bindings.resolution_unknown_affects_utility_claim==true and .bindings.provenance_only==false and
            (.metrics|length)==8 and all(.metrics[]; .denominator==1 and (.numerator|type)=="number")
          ' "$evidence/integration/scenarios/normal/integration-artifact.json" >/dev/null
          cat "$evidence/integration/scenarios/normal/integration-artifact.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$evidence/integration/integrated-conformance.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '
            .schema=="gooo/reflexive-loop/causal-denominator-conformance/v1" and
            .tests=={scenarios:10,normal_selected:{executed:2,reused:1,skipped:1}} and
            .external_required_status_gates==0 and
            .precedence==["REFUTED","UNKNOWN","CLOSED"] and
            ([.scenarios[].decision]|sort)==["CLOSED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","UNKNOWN"] and
            .normal_performance_utility=={state:"UNKNOWN",stage:"IMPROVEMENT",step:"REQUIRE_EXACT_BEFORE_AFTER_PAIR",reason:"EXACT_BEFORE_AFTER_PAIR_MISSING",unknown_class:"CAUSALITY_UNPROVEN",next_operation:"PROVIDE_EXACT_BEFORE_AFTER_PAIR",blocked_by:["exact-before-after-pair"],preserved_exactly:true} and
            .performance.conformance_wall_ms>=0 and .performance.conformance_peak_rss_kib>=0
          ' "$evidence/causal-denominator/causal-denominator-conformance.json" >/dev/null
          jq -e '
            .schema=="gooo/reflexive-loop/causal-denominator-ci-artifact/v1" and
            .scenario=="normal" and .decision=="CLOSED" and
            .summary=={total:10,closed:10,unknown:0,refuted:0} and
            .causal_selection.counts=={execute:2,reuse:1,skip:1} and
            .verification_plan=={mode:"causal-selected-execute-reuse-skip",execute_tests:["test-add","test-integration"],reuse_tests:["test-normalize"],skip_tests:["test-subtract"],proof_contract_version:2,denominator:7} and
            .selected_verification=={execute:2,reuse:1,skip:1,plan_affects_apply:true} and
            .denominator_binding=={v1:6,v2:7,proof_denominator:7,affected_denominator_preserved:true,migration:{added:1,split:1,retired:1}} and
            .lifecycle.promotion=="PROMOTED" and .lifecycle.rollback.repository_writes==0 and
            .authority=={repository_writes:0,external_required_status_gates:0,input_repository_unchanged:true,local_tests_run:0} and
            .bindings.causal_input_affects_proposal==true and .bindings.causal_input_affects_verification_plan==true and
            .bindings.denominator_input_affects_proof_plan==true and .bindings.provenance_only==false and
            (.metrics|length)==10 and all(.metrics[]; .denominator==1 and (.numerator|type)=="number" and .activity != null and .source_file=="examples/reflexive-loop/main.gooo" and .ir_node_kind=="Activity" and .generated_artifact != null and .evaluator != null)
          ' "$evidence/causal-denominator/scenarios/normal/causal-denominator-artifact.json" >/dev/null
          cat "$evidence/causal-denominator/scenarios/normal/causal-denominator-artifact.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$evidence/causal-denominator/causal-denominator-conformance.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload loop evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-reflexive-loop-evidence
          path: ${{ runner.temp }}/gooo-reflexive-loop-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact identity
        run: |
          {
            echo "### Evidence artifact"
            echo "artifact_id: ${{ steps.evidence.outputs.artifact-id }}"
            echo "artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
