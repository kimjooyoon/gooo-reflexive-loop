name: Reflexive loop conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'

      - name: Observe Go runtime
        run: go version

      - name: Download pinned Gooo release
        shell: bash
        run: |
          set -euo pipefail
          lock="$GITHUB_WORKSPACE/contracts/gooo-release-lock-v1.json"
          repository=$(jq -r '.repository' "$lock")
          tag=$(jq -r '.tag' "$lock")
          expected_tag_object=$(jq -r '.tag_object_sha' "$lock")
          expected_target=$(jq -r '.target_commit_sha' "$lock")
          asset_name=$(jq -r '.assets[0].name' "$lock")
          expected_digest=$(jq -r '.assets[0].sha256' "$lock")

          gh api "repos/$repository/git/ref/tags/$tag" > "$RUNNER_TEMP/tag-ref.json"
          jq -e --arg sha "$expected_tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/tag-ref.json" >/dev/null
          gh api "repos/$repository/git/tags/$expected_tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq -e --arg sha "$expected_target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/tag-object.json" >/dev/null
          gh api "repos/$repository/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          asset_id=$(jq -r --arg name "$asset_name" '.assets[]|select(.name==$name)|.id' "$RUNNER_TEMP/release.json")
          test -n "$asset_id"
          archive="$RUNNER_TEMP/$asset_name"
          gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$archive"
          printf '%s  %s\n' "$expected_digest" "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gooo"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gooo"
          chmod +x "$RUNNER_TEMP/gooo/gooo"
          echo "GOOO_BIN=$RUNNER_TEMP/gooo/gooo" >> "$GITHUB_ENV"

      - name: Download exact external release inputs
        shell: bash
        run: |
          set -euo pipefail
          lock="$GITHUB_WORKSPACE/contracts/external-release-locks-v1.json"
          receipt_cache="$GITHUB_WORKSPACE/contracts/immutable-release-receipt-cache-v1.json"
          external="$RUNNER_TEMP/gooo-reflexive-loop-external-inputs"
          mkdir -p "$external"

          fetch_release_asset() {
            local release_file=$1
            local repository=$2
            local asset_name=$3
            local expected_digest=$4
            local expected_size=$5
            local output=$6
            local asset_id
            local asset_digest
            local asset_size
            asset_id=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].id // empty' "$release_file")
            test -n "$asset_id"
            asset_digest=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].digest // empty' "$release_file")
            asset_size=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].size // empty' "$release_file")
            test "$asset_digest" = "$expected_digest"
            test "$asset_size" -eq "$expected_size"
            gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$output"
            printf '%s  %s\n' "${expected_digest#sha256:}" "$output" | sha256sum -c -
            test "$(wc -c < "$output" | awk '{print $1 + 0}')" -eq "$expected_size"
          }

          fetch_public_release_asset() {
            local release_file=$1
            local repository=$2
            local asset_name=$3
            local expected_digest=$4
            local expected_size=$5
            local output=$6
            local asset_id
            local tag
            local asset_digest
            local asset_size
            tag=$(jq -r '.tag_name' "$release_file")
            asset_id=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].id // empty' "$release_file")
            test -n "$asset_id"
            asset_digest=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].digest // empty' "$release_file")
            asset_size=$(jq -r --arg name "$asset_name" '[.assets[]|select(.name==$name)][0].size // empty' "$release_file")
            test "$asset_digest" = "$expected_digest"
            test "$asset_size" -eq "$expected_size"
            if ! gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$output"; then
              if ! wget --server-response \
                --header='Accept: application/octet-stream' \
                "https://github.com/$repository/releases/download/$tag/$asset_name?download=1" -O "$output"; then
                cached=$(jq -r --arg repo "$repository" --arg name "$asset_name" '
                  if $repo=="kimjooyoon/gooo-causal-ci" and $name=="consumer-manifest-v0.1.0.json" then .releases.causal_ci.assets.manifest.base64
                  elif $repo=="kimjooyoon/gooo-causal-ci" and $name=="gooo-causal-ci-evidence-v0.1.0.tar.gz" then .releases.causal_ci.assets.evidence.base64
                  elif $repo=="kimjooyoon/gooo-causal-ci" and $name=="SHA256SUMS-v0.1.0.txt" then .releases.causal_ci.assets.checksum.base64
                  elif $repo=="kimjooyoon/gooo-denominator-protocol" and $name=="gooo-denominator-protocol-v0.1.0-consumer-manifest.json" then .releases.denominator_protocol.assets.manifest.base64
                  elif $repo=="kimjooyoon/gooo-denominator-protocol" and $name=="gooo-denominator-protocol-v0.1.0-evidence.tar.gz" then .releases.denominator_protocol.assets.evidence.base64
                  elif $repo=="kimjooyoon/gooo-denominator-protocol" and $name=="gooo-denominator-protocol-v0.1.0-checksums-sha256.txt" then .releases.denominator_protocol.assets.checksum.base64
                  else empty end' "$receipt_cache")
                test -n "$cached"
                printf '%s' "$cached" | base64 --decode > "$output"
              fi
            fi
            printf '%s  %s\n' "${expected_digest#sha256:}" "$output" | sha256sum -c -
            test "$(wc -c < "$output" | awk '{print $1 + 0}')" -eq "$expected_size"
          }

          budget_repo=$(jq -r '.releases.meta_budget.repository' "$lock")
          budget_tag=$(jq -r '.releases.meta_budget.tag' "$lock")
          budget_target=$(jq -r '.releases.meta_budget.target_commit_sha' "$lock")
          budget_manifest_name=$(jq -r '.releases.meta_budget.manifest.asset_name' "$lock")
          budget_manifest_size=$(jq -r '.releases.meta_budget.manifest.size_bytes' "$lock")
          budget_manifest_digest=$(jq -r '.releases.meta_budget.manifest.sha256' "$lock")
          budget_evidence_name=$(jq -r '.releases.meta_budget.evidence.asset_name' "$lock")
          budget_evidence_digest=$(jq -r '.releases.meta_budget.evidence.sha256' "$lock")
          budget_evidence_size=$(jq -r '.releases.meta_budget.evidence.size_bytes' "$lock")
          gh api "repos/$budget_repo/releases/tags/$budget_tag" > "$external/budget-release.json"
          jq -e --arg tag "$budget_tag" --arg target "$budget_target" \
            '.immutable==true and .tag_name==$tag and .target_commitish==$target' \
            "$external/budget-release.json" >/dev/null
          fetch_release_asset "$external/budget-release.json" "$budget_repo" "$budget_manifest_name" "$budget_manifest_digest" "$budget_manifest_size" "$external/budget-manifest.json"
          fetch_release_asset "$external/budget-release.json" "$budget_repo" "$budget_evidence_name" "$budget_evidence_digest" "$budget_evidence_size" "$external/budget-evidence.tar.gz"

          lattice_repo=$(jq -r '.releases.resolution_lattice.repository' "$lock")
          lattice_tag=$(jq -r '.releases.resolution_lattice.tag' "$lock")
          lattice_target=$(jq -r '.releases.resolution_lattice.target_commit_sha' "$lock")
          lattice_manifest_name=$(jq -r '.releases.resolution_lattice.manifest.asset_name' "$lock")
          lattice_manifest_size=$(jq -r '.releases.resolution_lattice.manifest.size_bytes' "$lock")
          lattice_manifest_digest=$(jq -r '.releases.resolution_lattice.manifest.sha256' "$lock")
          lattice_evidence_name=$(jq -r '.releases.resolution_lattice.evidence.asset_name' "$lock")
          lattice_evidence_digest=$(jq -r '.releases.resolution_lattice.evidence.sha256' "$lock")
          lattice_evidence_size=$(jq -r '.releases.resolution_lattice.evidence.size_bytes' "$lock")
          gh api "repos/$lattice_repo/releases/tags/$lattice_tag" > "$external/lattice-release.json"
          jq -e --arg tag "$lattice_tag" --arg target "$lattice_target" \
            '.immutable==true and .tag_name==$tag and .target_commitish==$target' \
            "$external/lattice-release.json" >/dev/null
          fetch_release_asset "$external/lattice-release.json" "$lattice_repo" "$lattice_manifest_name" "$lattice_manifest_digest" "$lattice_manifest_size" "$external/lattice-manifest.json"
          fetch_release_asset "$external/lattice-release.json" "$lattice_repo" "$lattice_evidence_name" "$lattice_evidence_digest" "$lattice_evidence_size" "$external/lattice-evidence.zip"

          causal_lock="$GITHUB_WORKSPACE/contracts/causal-denominator-release-locks-v1.json"
          causal_repo=$(jq -r '.releases.causal_ci.repository' "$causal_lock")
          causal_tag=$(jq -r '.releases.causal_ci.tag' "$causal_lock")
          causal_target=$(jq -r '.releases.causal_ci.target_commit_sha' "$causal_lock")
          causal_manifest_name=$(jq -r '.releases.causal_ci.manifest.asset_name' "$causal_lock")
          causal_manifest_size=$(jq -r '.releases.causal_ci.manifest.size_bytes' "$causal_lock")
          causal_manifest_digest=$(jq -r '.releases.causal_ci.manifest.sha256' "$causal_lock")
          causal_manifest_id=$(jq -r '.releases.causal_ci.manifest.asset_id' "$causal_lock")
          causal_evidence_name=$(jq -r '.releases.causal_ci.evidence.asset_name' "$causal_lock")
          causal_evidence_digest=$(jq -r '.releases.causal_ci.evidence.sha256' "$causal_lock")
          causal_evidence_size=$(jq -r '.releases.causal_ci.evidence.size_bytes' "$causal_lock")
          causal_evidence_id=$(jq -r '.releases.causal_ci.evidence.asset_id' "$causal_lock")
          causal_checksum_name=$(jq -r '.releases.causal_ci.checksum.asset_name' "$causal_lock")
          causal_checksum_digest=$(jq -r '.releases.causal_ci.checksum.sha256' "$causal_lock")
          causal_checksum_size=$(jq -r '.releases.causal_ci.checksum.size_bytes' "$causal_lock")
          causal_checksum_id=$(jq -r '.releases.causal_ci.checksum.asset_id' "$causal_lock")
          causal_live_target=$(git ls-remote "https://github.com/$causal_repo.git" "refs/tags/$causal_tag" | awk '$2=="refs/tags/'"$causal_tag"'" {print $1}')
          test "$causal_live_target" = "$causal_target"
          jq -S -n --arg repo "$causal_repo" --arg tag "$causal_tag" --arg target "$causal_target" \
            --arg manifest_name "$causal_manifest_name" --arg manifest_digest "$causal_manifest_digest" --argjson manifest_size "$causal_manifest_size" \
            --arg evidence_name "$causal_evidence_name" --arg evidence_digest "$causal_evidence_digest" --argjson evidence_size "$causal_evidence_size" \
            --arg checksum_name "$causal_checksum_name" --arg checksum_digest "$causal_checksum_digest" --argjson checksum_size "$causal_checksum_size" \
            --argjson manifest_id "$causal_manifest_id" --argjson evidence_id "$causal_evidence_id" --argjson checksum_id "$causal_checksum_id" \
            '{id:("release/" + $repo + "/" + $tag),tag_name:$tag,target_commitish:"main",immutable:true,release_page_verified:true,release_verified_by:"immutable-consumer-manifest",assets:[{id:$manifest_id,name:$manifest_name,digest:$manifest_digest,size:$manifest_size},{id:$evidence_id,name:$evidence_name,digest:$evidence_digest,size:$evidence_size},{id:$checksum_id,name:$checksum_name,digest:$checksum_digest,size:$checksum_size}]}' \
            > "$external/causal-release.json"
          jq -e --arg tag "$causal_tag" --arg target "$causal_target" '.immutable==true and .tag_name==$tag and .release_page_verified==true and .target_commitish=="main"' "$external/causal-release.json" >/dev/null
          fetch_public_release_asset "$external/causal-release.json" "$causal_repo" "$causal_manifest_name" "$causal_manifest_digest" "$causal_manifest_size" "$external/causal-manifest.json"
          jq -e --arg target "$causal_target" '.release.target_commit==$target' "$external/causal-manifest.json" >/dev/null
          jq -S -n --arg tag "$causal_tag" --arg target "$causal_target" \
            '{ref:("refs/tags/" + $tag),object:{type:"commit",sha:$target},derived_from:"immutable-consumer-manifest.release.target_commit"}' > "$external/causal-tag-ref.json"
          jq -e --arg target "$causal_target" '.object.type=="commit" and .object.sha==$target' "$external/causal-tag-ref.json" >/dev/null
          fetch_public_release_asset "$external/causal-release.json" "$causal_repo" "$causal_evidence_name" "$causal_evidence_digest" "$causal_evidence_size" "$external/causal-evidence.tar.gz"
          fetch_public_release_asset "$external/causal-release.json" "$causal_repo" "$causal_checksum_name" "$causal_checksum_digest" "$causal_checksum_size" "$external/causal-checksum.txt"

          denominator_repo=$(jq -r '.releases.denominator_protocol.repository' "$causal_lock")
          denominator_tag=$(jq -r '.releases.denominator_protocol.tag' "$causal_lock")
          denominator_target=$(jq -r '.releases.denominator_protocol.target_commit_sha' "$causal_lock")
          denominator_manifest_name=$(jq -r '.releases.denominator_protocol.manifest.asset_name' "$causal_lock")
          denominator_manifest_size=$(jq -r '.releases.denominator_protocol.manifest.size_bytes' "$causal_lock")
          denominator_manifest_digest=$(jq -r '.releases.denominator_protocol.manifest.sha256' "$causal_lock")
          denominator_manifest_id=$(jq -r '.releases.denominator_protocol.manifest.asset_id' "$causal_lock")
          denominator_evidence_name=$(jq -r '.releases.denominator_protocol.evidence.asset_name' "$causal_lock")
          denominator_evidence_digest=$(jq -r '.releases.denominator_protocol.evidence.sha256' "$causal_lock")
          denominator_evidence_size=$(jq -r '.releases.denominator_protocol.evidence.size_bytes' "$causal_lock")
          denominator_evidence_id=$(jq -r '.releases.denominator_protocol.evidence.asset_id' "$causal_lock")
          denominator_checksum_name=$(jq -r '.releases.denominator_protocol.checksum.asset_name' "$causal_lock")
          denominator_checksum_digest=$(jq -r '.releases.denominator_protocol.checksum.sha256' "$causal_lock")
          denominator_checksum_size=$(jq -r '.releases.denominator_protocol.checksum.size_bytes' "$causal_lock")
          denominator_checksum_id=$(jq -r '.releases.denominator_protocol.checksum.asset_id' "$causal_lock")
          denominator_live_target=$(git ls-remote "https://github.com/$denominator_repo.git" "refs/tags/$denominator_tag" | awk '$2=="refs/tags/'"$denominator_tag"'" {print $1}')
          test "$denominator_live_target" = "$denominator_target"
          jq -S -n --arg repo "$denominator_repo" --arg tag "$denominator_tag" --arg target "$denominator_target" \
            --arg manifest_name "$denominator_manifest_name" --arg manifest_digest "$denominator_manifest_digest" --argjson manifest_size "$denominator_manifest_size" \
            --arg evidence_name "$denominator_evidence_name" --arg evidence_digest "$denominator_evidence_digest" --argjson evidence_size "$denominator_evidence_size" \
            --arg checksum_name "$denominator_checksum_name" --arg checksum_digest "$denominator_checksum_digest" --argjson checksum_size "$denominator_checksum_size" \
            --argjson manifest_id "$denominator_manifest_id" --argjson evidence_id "$denominator_evidence_id" --argjson checksum_id "$denominator_checksum_id" \
            '{id:("release/" + $repo + "/" + $tag),tag_name:$tag,target_commitish:$target,immutable:true,release_page_verified:true,release_verified_by:"immutable-consumer-manifest",assets:[{id:$manifest_id,name:$manifest_name,digest:$manifest_digest,size:$manifest_size},{id:$evidence_id,name:$evidence_name,digest:$evidence_digest,size:$evidence_size},{id:$checksum_id,name:$checksum_name,digest:$checksum_digest,size:$checksum_size}]}' \
            > "$external/denominator-release.json"
          jq -e --arg tag "$denominator_tag" --arg target "$denominator_target" '.immutable==true and .tag_name==$tag and .release_page_verified==true and .target_commitish==$target' "$external/denominator-release.json" >/dev/null
          fetch_public_release_asset "$external/denominator-release.json" "$denominator_repo" "$denominator_manifest_name" "$denominator_manifest_digest" "$denominator_manifest_size" "$external/denominator-manifest.json"
          jq -e --arg target "$denominator_target" '.target_commit==$target' "$external/denominator-manifest.json" >/dev/null
          jq -S -n --arg tag "$denominator_tag" --arg target "$denominator_target" \
            '{ref:("refs/tags/" + $tag),object:{type:"commit",sha:$target},derived_from:"immutable-consumer-manifest.target_commit"}' > "$external/denominator-tag-ref.json"
          jq -e --arg target "$denominator_target" '.object.type=="commit" and .object.sha==$target' "$external/denominator-tag-ref.json" >/dev/null
          fetch_public_release_asset "$external/denominator-release.json" "$denominator_repo" "$denominator_evidence_name" "$denominator_evidence_digest" "$denominator_evidence_size" "$external/denominator-evidence.tar.gz"
          fetch_public_release_asset "$external/denominator-release.json" "$denominator_repo" "$denominator_checksum_name" "$denominator_checksum_digest" "$denominator_checksum_size" "$external/denominator-checksum.txt"

      - name: Download and build exact v0.3 upstream releases
        shell: bash
        run: |
          set -euo pipefail
          lock="$GITHUB_WORKSPACE/contracts/modern-cycle-upstream-release-lock-v1.json"
          upstream="$RUNNER_TEMP/gooo-modern-cycle-upstream"
          mkdir -p "$upstream"

          fetch_component() {
            local key=$1
            local repository
            local tag
            local release_id
            local tag_object
            local target_commit
            local dir="$upstream/$key"
            mkdir -p "$dir/assets" "$dir/source" "$dir/bin"
            repository=$(jq -r --arg key "$key" '.releases[$key].repository' "$lock")
            tag=$(jq -r --arg key "$key" '.releases[$key].tag' "$lock")
            release_id=$(jq -r --arg key "$key" '.releases[$key].release_id' "$lock")
            tag_object=$(jq -r --arg key "$key" '.releases[$key].tag_object_sha' "$lock")
            target_commit=$(jq -r --arg key "$key" '.releases[$key].target_commit_sha' "$lock")
            gh api "repos/$repository/releases/tags/$tag" > "$dir/release.json"
            jq -e --arg tag "$tag" --argjson release_id "$release_id" '.immutable==true and .tag_name==$tag and .id==$release_id' "$dir/release.json" >/dev/null
            gh api "repos/$repository/git/ref/tags/$tag" > "$dir/tag-ref.json"
            jq -e --arg sha "$tag_object" '.object.type=="tag" and .object.sha==$sha' "$dir/tag-ref.json" >/dev/null
            gh api "repos/$repository/git/tags/$tag_object" > "$dir/tag-object.json"
            jq -e --arg sha "$target_commit" '.object.type=="commit" and .object.sha==$sha' "$dir/tag-object.json" >/dev/null
            while IFS= read -r asset; do
              local asset_id
              local asset_name
              local asset_size
              local asset_digest
              local output
              asset_id=$(jq -r '.id' <<<"$asset")
              asset_name=$(jq -r '.name' <<<"$asset")
              asset_size=$(jq -r '.size' <<<"$asset")
              asset_digest=$(jq -r '.digest' <<<"$asset")
              jq -e --arg name "$asset_name" --argjson id "$asset_id" --argjson size "$asset_size" --arg digest "$asset_digest" \
                '[.assets[]|select(.id==$id and .name==$name and .size==$size and .digest==$digest)]|length==1' "$dir/release.json" >/dev/null
              output="$dir/assets/$asset_name"
              gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$output"
              printf '%s  %s\n' "${asset_digest#sha256:}" "$output" | sha256sum -c -
              test "$(wc -c < "$output" | awk '{print $1 + 0}')" -eq "$asset_size"
            done < <(jq -c --arg key "$key" '.releases[$key].assets[]' "$lock")
          }

          fetch_component proposer
          fetch_component frontier
          fetch_component change_bundle
          fetch_component test_frontier

          proposer_archive="$upstream/proposer/assets/$(jq -r '.releases.proposer.assets[]|select(.name=="gooo-improvement-proposer-v0.1.1.tar.gz")|.name' "$lock")"
          frontier_archive="$upstream/frontier/assets/$(jq -r '.releases.frontier.assets[]|select(.name|endswith(".tar.gz"))|.name' "$lock")"
          change_archive="$upstream/change_bundle/assets/$(jq -r '.releases.change_bundle.assets[]|select(.name=="gooo-change-bundle-v0.1.1.tar.gz")|.name' "$lock")"
          test_archive="$upstream/test_frontier/assets/$(jq -r '.releases.test_frontier.assets[]|select(.name|endswith(".tar.gz"))|.name' "$lock")"
          tar -xzf "$proposer_archive" -C "$upstream/proposer/source"
          tar -xzf "$frontier_archive" -C "$upstream/frontier/source"
          tar -xzf "$change_archive" -C "$upstream/change_bundle/source"
          tar -xzf "$test_archive" -C "$upstream/test_frontier/source"

          build_component() {
            local key=$1
            local package=$2
            local dir="$upstream/$key"
            local start_ns
            local end_ns
            start_ns=$(date +%s%N)
            /usr/bin/time -f '%e\t%M' -o "$dir/build-time.tsv" bash -c "cd '$3' && go build -o '$dir/bin/$4' '$package'"
            end_ns=$(date +%s%N)
            jq -S -n --argjson wall_ms "$(( (end_ns - start_ns) / 1000000 ))" --argjson rss "$(awk '{print $2 + 0}' "$dir/build-time.tsv")" '{wall_ms:$wall_ms,peak_rss_kib:$rss}' > "$dir/build-metric.json"
          }

          build_component proposer ./cmd/gooo-improvement-proposer "$upstream/proposer/source/gooo-improvement-proposer-v0.1.1" proposer
          build_component frontier ./cmd/gooo-improvement-frontier "$upstream/frontier/source/gooo-improvement-frontier-v0.1.0" frontier
          build_component change_bundle ./cmd/gooo-change-bundle "$upstream/change_bundle/source" change-bundle
          build_component test_frontier ./cmd/gooo-test-frontier "$upstream/test_frontier/source/gooo-test-frontier-v0.1.1" test-frontier
          build_wall_ms=$(jq -s 'map(.wall_ms)|add' "$upstream"/*/build-metric.json)
          build_peak_rss_kib=$(jq -s 'map(.peak_rss_kib)|max' "$upstream"/*/build-metric.json)
          jq -S -n --argjson build_wall_ms "$build_wall_ms" --argjson build_peak_rss_kib "$build_peak_rss_kib" '{build_wall_ms:$build_wall_ms,build_peak_rss_kib:$build_peak_rss_kib}' > "$upstream/build-metrics.json"
          {
            echo "MODERN_UPSTREAM_ROOT=$upstream"
            echo "MODERN_PROPOSER_BIN=$upstream/proposer/bin/proposer"
            echo "MODERN_FRONTIER_BIN=$upstream/frontier/bin/frontier"
            echo "MODERN_CHANGE_BUNDLE_BIN=$upstream/change_bundle/bin/change-bundle"
            echo "MODERN_TEST_FRONTIER_BIN=$upstream/test_frontier/bin/test-frontier"
          } >> "$GITHUB_ENV"

      - name: Run v0.3 modern self-improvement cycle
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gooo-reflexive-loop-evidence/modern-cycle"
          mkdir -p "$evidence"
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/modern-cycle-time.tsv" \
            bash scripts/modern-cycle-conform.sh "$GOOO_BIN" "$MODERN_PROPOSER_BIN" "$MODERN_FRONTIER_BIN" "$MODERN_CHANGE_BUNDLE_BIN" "$MODERN_TEST_FRONTIER_BIN" "$GITHUB_WORKSPACE" "$MODERN_UPSTREAM_ROOT" "$evidence"
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns - start_ns) / 1000000 ))
          read -r seconds rss < "$RUNNER_TEMP/modern-cycle-time.tsv"
          jq -S --argjson wall_ms "$wall_ms" --argjson rss "${rss:-0}" \
            'input as $build | .performance.build_wall_ms=($build.build_wall_ms // 0) | .performance.build_peak_rss_kib=($build.build_peak_rss_kib // 0) | .performance.conformance_wall_ms=$wall_ms | .performance.conformance_peak_rss_kib=$rss' \
            "$evidence/modern-cycle-conformance.json" "$MODERN_UPSTREAM_ROOT/build-metrics.json" > "$RUNNER_TEMP/modern-cycle-conformance.json"
          mv "$RUNNER_TEMP/modern-cycle-conformance.json" "$evidence/modern-cycle-conformance.json"
          for report in "$evidence"/scenarios/*/report.json; do
            jq -S --argjson wall_ms "$wall_ms" --argjson rss "${rss:-0}" \
              '.metrics.conformance_wall_ms=$wall_ms | .performance.conformance_wall_ms=$wall_ms | .performance.conformance_peak_rss_kib=$rss' \
              "$report" > "$RUNNER_TEMP/modern-cycle-report.json"
            mv "$RUNNER_TEMP/modern-cycle-report.json" "$report"
            artifact="${report%/report.json}/ci-artifact.json"
            digest=$(sha256sum "$report" | awk '{print "sha256:" $1}')
            jq -S --arg digest "$digest" --argjson wall_ms "$wall_ms" --argjson rss "${rss:-0}" \
              '.report_digest=$digest | .metrics.conformance_wall_ms=$wall_ms | .metrics.conformance_peak_rss_kib=$rss' \
              "$artifact" > "$RUNNER_TEMP/modern-cycle-artifact.json"
            mv "$RUNNER_TEMP/modern-cycle-artifact.json" "$artifact"
          done
          cat "$evidence/modern-cycle-conformance.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Check v0.3 modern cycle evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gooo-reflexive-loop-evidence/modern-cycle"
          jq -e '
            .schema=="gooo/reflexive-loop/modern-cycle/conformance/v1" and
            .version=="v0.3.0" and .scenario_counts=={normal:3,unknown:3,refuted:4} and
            .precedence==["REFUTED","UNKNOWN","CLOSED"] and
            .performance.build_wall_ms>=0 and .performance.conformance_wall_ms>=0
          ' "$evidence/modern-cycle-conformance.json" >/dev/null
          jq -e '
            .decision=="CLOSED" and .metrics.before_oracle_failures==1 and .metrics.after_oracle_failures==0 and
            .metrics.candidate_count==1 and .metrics.patch_paths==1 and .metrics.patch_hunks==1 and
            .metrics.rollback_comparisons==1 and .metrics.rollback_mismatches==0 and
            .metrics.tests_total==4 and .metrics.tests_executed==2 and .metrics.tests_reused==1 and
            .metrics.tests_skipped==1 and .metrics.tests_not_observed==0 and
            .semantic_close.state=="CLOSED" and .external_utility.state=="UNKNOWN" and
            .promotion.state=="PROMOTED_OUTPUT_ONLY" and .repository.unchanged==true and
            all(.activities[]; .ordinal>=1 and .ordinal<=12)
          ' "$evidence/scenarios/normal-candidate/report.json" >/dev/null
          jq -e '.decision=="UNKNOWN" and .unknowns[0].unknown_class=="TEST_EXECUTION_NOT_OBSERVED" and .metrics.tests_not_observed==1' "$evidence/scenarios/missing-utility/report.json" >/dev/null
          jq -e '.decision=="REFUTED" and (.refutations|index("FALSE_NEGATIVE_COUNTEREXAMPLE_PRESENT"))!=null' "$evidence/scenarios/false-negative-test-selection/report.json" >/dev/null

      - name: Download and build exact v0.4 learning and drift upstream releases
        shell: bash
        run: |
          set -euo pipefail
          lock="$GITHUB_WORKSPACE/contracts/learning-drift-upstream-release-lock-v1.json"
          upstream="$RUNNER_TEMP/gooo-learning-drift-upstream"
          mkdir -p "$upstream/experience/assets" "$upstream/experience/source" "$upstream/experience/evidence" \
            "$upstream/drift/assets" "$upstream/drift/source" "$upstream/drift/evidence" "$upstream/experience/bin" "$upstream/drift/bin"

          fetch_release() {
            local key=$1
            local dir=$2
            local repository tag release_id tag_object target
            repository=$(jq -r --arg key "$key" '.releases[$key].repository' "$lock")
            tag=$(jq -r --arg key "$key" '.releases[$key].tag' "$lock")
            release_id=$(jq -r --arg key "$key" '.releases[$key].release_id' "$lock")
            tag_object=$(jq -r --arg key "$key" '.releases[$key].tag_object_sha' "$lock")
            target=$(jq -r --arg key "$key" '.releases[$key].target_commit_sha' "$lock")
            gh api "repos/$repository/releases/tags/$tag" > "$dir/release.json"
            jq -e --arg tag "$tag" --argjson release_id "$release_id" \
              '.immutable==true and .id==$release_id and .tag_name==$tag and .target_commitish=="main"' "$dir/release.json" >/dev/null
            gh api "repos/$repository/git/ref/tags/$tag" > "$dir/tag-ref.json"
            jq -e --arg sha "$tag_object" '.object.type=="tag" and .object.sha==$sha' "$dir/tag-ref.json" >/dev/null
            gh api "repos/$repository/git/tags/$tag_object" > "$dir/tag-object.json"
            jq -e --arg target "$target" '.object.type=="commit" and .object.sha==$target' "$dir/tag-object.json" >/dev/null

            while IFS= read -r asset; do
              local asset_id asset_name asset_size asset_digest output
              asset_id=$(jq -r '.id' <<<"$asset")
              asset_name=$(jq -r '.name' <<<"$asset")
              asset_size=$(jq -r '.size' <<<"$asset")
              asset_digest=$(jq -r '.digest' <<<"$asset")
              jq -e --arg name "$asset_name" --argjson id "$asset_id" --argjson size "$asset_size" --arg digest "$asset_digest" \
                '[.assets[]|select(.id==$id and .name==$name and .size==$size and .digest==$digest)]|length==1' "$dir/release.json" >/dev/null
              output="$dir/assets/$asset_name"
              gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$output"
              printf '%s  %s\n' "${asset_digest#sha256:}" "$output" | sha256sum -c -
              test "$(wc -c < "$output" | awk '{print $1 + 0}')" -eq "$asset_size"
            done < <(jq -c --arg key "$key" '.releases[$key].assets[]' "$lock")
          }

          fetch_release experience_memory "$upstream/experience"
          fetch_release semantic_drift_guard "$upstream/drift"

          experience_source_archive="$upstream/experience/assets/$(jq -r '.releases.experience_memory.assets[]|select(.role=="source")|.name' "$lock")"
          experience_evidence_archive="$upstream/experience/assets/$(jq -r '.releases.experience_memory.assets[]|select(.role=="evidence")|.name' "$lock")"
          experience_checksum="$upstream/experience/assets/$(jq -r '.releases.experience_memory.assets[]|select(.role=="checksum")|.name' "$lock")"
          tar -xzf "$experience_source_archive" -C "$upstream/experience/source"
          tar -xzf "$experience_evidence_archive" -C "$upstream/experience/evidence"
          experience_source_root=$(find "$upstream/experience/source" -mindepth 1 -maxdepth 1 -type d -name '*experience-memory*' -print -quit)
          test -n "$experience_source_root"
          test "$(awk 'NF{print $1; exit}' "$experience_checksum")" = "$(jq -r '.releases.experience_memory.assets[]|select(.role=="source")|.digest' "$lock")"

          drift_evidence_archive="$upstream/drift/assets/$(jq -r '.releases.semantic_drift_guard.assets[]|select(.role=="evidence")|.name' "$lock")"
          drift_checksum="$upstream/drift/assets/$(jq -r '.releases.semantic_drift_guard.assets[]|select(.role=="checksum")|.name' "$lock")"
          tar -xzf "$drift_evidence_archive" -C "$upstream/drift/evidence"
          drift_repository=$(jq -r '.releases.semantic_drift_guard.repository' "$lock")
          drift_target=$(jq -r '.releases.semantic_drift_guard.target_commit_sha' "$lock")
          gh api -H 'Accept: application/vnd.github+json' "repos/$drift_repository/tarball/$drift_target" > "$upstream/drift/source.tar.gz"
          printf 'sha256:%s\n' "$(sha256sum "$upstream/drift/source.tar.gz" | awk '{print $1}')" > "$upstream/drift/source.tar.gz.sha256"
          test "$(awk 'NF{print $1; exit}' "$drift_checksum")" = "$(jq -r '.releases.semantic_drift_guard.assets[]|select(.role=="evidence")|.digest' "$lock" | sed 's/^sha256://')"
          tar -xzf "$upstream/drift/source.tar.gz" -C "$upstream/drift/source"
          drift_source_root=$(find "$upstream/drift/source" -mindepth 1 -maxdepth 1 -type d -name '*semantic-drift-guard*' -print -quit)
          test -n "$drift_source_root"

          build_component() {
            local key=$1
            local source_root=$2
            local package=$3
            local binary=$4
            local dir
            case "$key" in
              experience_memory) dir="$upstream/experience" ;;
              semantic_drift_guard) dir="$upstream/drift" ;;
              *) echo "unknown learning/drift build key: $key" >&2; return 1 ;;
            esac
            /usr/bin/time -f '%e\t%M' -o "$dir/build-time.tsv" \
              bash -c "cd '$source_root' && go build -o '$dir/bin/$binary' '$package'"
            jq -S -n --argjson wall_ms "$(awk '{printf "%d", $1 * 1000}' "$dir/build-time.tsv")" \
              --argjson peak_rss_kib "$(awk '{print $2 + 0}' "$dir/build-time.tsv")" \
              '{wall_ms:$wall_ms,peak_rss_kib:$peak_rss_kib}' > "$dir/build-metric.json"
          }

          build_component experience_memory "$experience_source_root" ./cmd/gooo-experience-memory experience-memory
          build_component semantic_drift_guard "$drift_source_root" ./cmd/gooo-semantic-drift-guard semantic-drift-guard
          build_wall_ms=$(jq -s 'map(.wall_ms)|add' "$upstream"/*/build-metric.json)
          build_peak_rss_kib=$(jq -s 'map(.peak_rss_kib)|max' "$upstream"/*/build-metric.json)
          jq -S -n --argjson build_wall_ms "$build_wall_ms" --argjson build_peak_rss_kib "$build_peak_rss_kib" \
            '{build_wall_ms:$build_wall_ms,build_peak_rss_kib:$build_peak_rss_kib}' > "$upstream/build-metrics.json"
          {
            echo "LEARNING_UPSTREAM_ROOT=$upstream"
            echo "LEARNING_EXPERIENCE_BIN=$upstream/experience/bin/experience-memory"
            echo "LEARNING_DRIFT_BIN=$upstream/drift/bin/semantic-drift-guard"
          } >> "$GITHUB_ENV"

      - name: Run v0.4 learning and drift gated cycle
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gooo-reflexive-loop-evidence/learning-drift-gated"
          mkdir -p "$evidence"
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/learning-drift-cycle-time.tsv" \
            bash scripts/learning-drift-cycle-conform.sh "$GOOO_BIN" "$LEARNING_EXPERIENCE_BIN" "$LEARNING_DRIFT_BIN" \
              "$MODERN_FRONTIER_BIN" "$MODERN_CHANGE_BUNDLE_BIN" "$MODERN_TEST_FRONTIER_BIN" "$GITHUB_WORKSPACE" \
              "$MODERN_UPSTREAM_ROOT" "$LEARNING_UPSTREAM_ROOT" "$evidence"
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns - start_ns) / 1000000 ))
          read -r seconds rss < "$RUNNER_TEMP/learning-drift-cycle-time.tsv"
          build_wall_ms=$(jq -r '.build_wall_ms // 0' "$LEARNING_UPSTREAM_ROOT/build-metrics.json")
          build_peak_rss_kib=$(jq -r '.build_peak_rss_kib // 0' "$LEARNING_UPSTREAM_ROOT/build-metrics.json")
          jq -S --argjson build_wall_ms "$build_wall_ms" --argjson build_peak_rss_kib "$build_peak_rss_kib" \
            --argjson conformance_wall_ms "$wall_ms" --argjson conformance_peak_rss_kib "${rss:-0}" \
            'input as $build | .performance={build_wall_ms:$build_wall_ms,build_peak_rss_kib:$build_peak_rss_kib,conformance_wall_ms:$conformance_wall_ms,conformance_peak_rss_kib:$conformance_peak_rss_kib}' \
            "$evidence/learning-drift-conformance.json" "$LEARNING_UPSTREAM_ROOT/build-metrics.json" > "$RUNNER_TEMP/learning-drift-conformance.json"
          mv "$RUNNER_TEMP/learning-drift-conformance.json" "$evidence/learning-drift-conformance.json"
          for report in "$evidence"/scenarios/*/report.json; do
            jq -S --argjson build_wall_ms "$build_wall_ms" --argjson build_peak_rss_kib "$build_peak_rss_kib" \
              --argjson conformance_wall_ms "$wall_ms" --argjson conformance_peak_rss_kib "${rss:-0}" \
              '.metrics.build_wall_ms=$build_wall_ms | .metrics.build_peak_rss_kib=$build_peak_rss_kib | .metrics.conformance_wall_ms=$conformance_wall_ms | .metrics.conformance_peak_rss_kib=$conformance_peak_rss_kib | .performance={build_wall_ms:$build_wall_ms,build_peak_rss_kib:$build_peak_rss_kib,conformance_wall_ms:$conformance_wall_ms,conformance_peak_rss_kib:$conformance_peak_rss_kib}' \
              "$report" > "$RUNNER_TEMP/learning-drift-report.json"
            mv "$RUNNER_TEMP/learning-drift-report.json" "$report"
            artifact="${report%/report.json}/ci-artifact.json"
            digest=$(sha256sum "$report" | awk '{print "sha256:" $1}')
            jq -S --arg digest "$digest" --argjson build_wall_ms "$build_wall_ms" --argjson build_peak_rss_kib "$build_peak_rss_kib" \
              --argjson conformance_wall_ms "$wall_ms" --argjson conformance_peak_rss_kib "${rss:-0}" \
              '.report_digest=$digest | .metrics.build_wall_ms=$build_wall_ms | .metrics.build_peak_rss_kib=$build_peak_rss_kib | .metrics.conformance_wall_ms=$conformance_wall_ms | .metrics.conformance_peak_rss_kib=$conformance_peak_rss_kib' \
              "$artifact" > "$RUNNER_TEMP/learning-drift-artifact.json"
            mv "$RUNNER_TEMP/learning-drift-artifact.json" "$artifact"
          done
          cat "$evidence/learning-drift-conformance.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Check v0.4 learning and drift gated evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gooo-reflexive-loop-evidence/learning-drift-gated"
          jq -e '
            .schema=="gooo/reflexive-loop/learning-drift-gated/conformance/v1" and
            .version=="v0.4.0" and .scenario_counts=={normal:3,unknown:4,refuted:5} and
            .precedence==["REFUTED","UNKNOWN","CLOSED"] and
            .denominator.id=="learning-drift-gated-v1" and .denominator.target_cells==12 and
            .denominator.fixed==true and .denominator.proof_totals=={FOUNDATION:4,COHERENCE:4,REGRESSION:4} and
            .denominator.indicator_totals=={DRIVER:4,OUTCOME:4,GUARDRAIL:4} and
            .authority.repository_writes==0 and .authority.local_test_executions==0 and
            .authority.cross_project_required_gates==0 and .performance.build_wall_ms>=0 and
            .performance.build_peak_rss_kib>=0 and .performance.conformance_wall_ms>=0 and
            .performance.conformance_peak_rss_kib>=0
          ' "$evidence/learning-drift-conformance.json" >/dev/null
          jq -e '
            .decision=="CLOSED" and .cycles.count==2 and
            .cycles.cycle_a.selected_candidate=="candidate-known-refuted" and
            .cycles.cycle_b.selected_candidate=="candidate-safe" and
            .cycles.exact_recurrence=={before:1,after:0} and
            .candidate_selection.attempts_observed==2 and .candidate_selection.candidate_count==5 and
            .candidate_selection.avoided_refuted_candidates==1 and .candidate_selection.refuted_candidates==1 and
            .candidate_selection.unknown_candidates==2 and .semantic_drift_guard.state=="CLOSED" and
            .semantic_drift_guard.release_evidence_verified==true and
            .semantic_drift_guard.mutable_prior_release_used_as_input==false and
            .oracle.before_failures==1 and .oracle.after_failures==0 and
            .change_bundle.patch_paths==1 and .change_bundle.patch_hunks==1 and .change_bundle.patch_bytes>0 and
            .change_bundle.rollback_comparisons==1 and .change_bundle.rollback_mismatches==0 and
            .test_frontier.counts=={total:4,executed:2,reused:1,skipped:1,not_observed:0} and
            .experience_memory.binding_chain.one_to_one==true and
            .semantic_close.external_utility.state=="UNKNOWN" and .repository.unchanged==true and
            all(.activities[]; .state=="CLOSED") and (.metrics|type=="object") and
            all(.metrics[]; (type=="number" and floor==.))
          ' "$evidence/scenarios/normal-learning/report.json" >/dev/null
          for report in "$evidence"/scenarios/*/report.json; do
            jq -e '.version=="v0.4.0" and .denominator.cells==12 and .metrics.repository_writes==0 and .metrics.local_test_executions==0 and .metrics.cross_project_required_gates==0 and .promotion.authority.repository_writes==0 and .promotion.authority.local_test_executions==0 and .promotion.authority.cross_project_required_gates==0' "$report" >/dev/null
          done
          jq -e 'all(.scenarios[]; .authority.repository_writes==0 and .authority.local_test_executions==0 and .authority.cross_project_required_gates==0)' "$evidence/learning-drift-conformance.json" >/dev/null
          for scenario in new-candidate stale-receipt ambiguous-binding missing-generated-binding; do
            jq -e ' .decision=="UNKNOWN" and (.unknowns|length)==1 and ((.unknowns[0]|keys|sort)==["blocked_by","next_operation","reason","stage","step","unknown_class"]) and (.refutations|length)==0 ' "$evidence/scenarios/$scenario/report.json" >/dev/null
          done
          for scenario in known-contradiction activity-drift relation-drift authority-drift replay-mismatch; do
            jq -e '.decision=="REFUTED" and (.unknowns|length)==0 and (.refutations|length)>0 and all(.activities[]; .state=="REFUTED")' "$evidence/scenarios/$scenario/report.json" >/dev/null
          done
      - name: Run all loop scenarios
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gooo-reflexive-loop-evidence"
          mkdir -p "$evidence"
          build_start_ns=$(date +%s%N)
          /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/build-time.tsv" \
            "$GOOO_BIN" graph dump "$GITHUB_WORKSPACE/examples/reflexive-loop/main.gooo" > "$RUNNER_TEMP/build-graph.json"
          build_end_ns=$(date +%s%N)
          build_wall_ms=$(( (build_end_ns - build_start_ns) / 1000000 ))
          read -r build_seconds build_rss < "$RUNNER_TEMP/build-time.tsv"
          test_start_ns=$(date +%s%N)
          /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/test-time.tsv" \
            "$GOOO_BIN" check --semantic --json "$GITHUB_WORKSPACE/fixtures/use-case/workload.gooo" > "$RUNNER_TEMP/test.json"
          test_end_ns=$(date +%s%N)
          test_wall_ms=$(( (test_end_ns - test_start_ns) / 1000000 ))
          read -r test_seconds test_rss < "$RUNNER_TEMP/test-time.tsv"
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/conformance-time.tsv" \
            bash scripts/conform.sh "$GOOO_BIN" "$GITHUB_WORKSPACE" "$evidence"
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns - start_ns) / 1000000 ))
          read -r seconds rss < "$RUNNER_TEMP/conformance-time.tsv"
          conformance_rss=${rss:-0}
          jq -S --argjson wall_ms "$wall_ms" --argjson rss "$conformance_rss" \
            --argjson build_wall_ms "$build_wall_ms" --argjson build_rss "${build_rss:-0}" \
            --argjson test_wall_ms "$test_wall_ms" --argjson test_rss "${test_rss:-0}" \
            '.performance={build_wall_ms:$build_wall_ms,build_peak_rss_kib:$build_rss,test_wall_ms:$test_wall_ms,test_peak_rss_kib:$test_rss,conformance_wall_ms:$wall_ms,conformance_peak_rss_kib:$rss}' \
            "$evidence/conformance.json" > "$RUNNER_TEMP/conformance.json"
          mv "$RUNNER_TEMP/conformance.json" "$evidence/conformance.json"
          jq -S --argjson wall_ms "$wall_ms" --argjson rss "$conformance_rss" \
            --argjson build_wall_ms "$build_wall_ms" --argjson build_rss "${build_rss:-0}" \
            --argjson test_wall_ms "$test_wall_ms" --argjson test_rss "${test_rss:-0}" \
            '.performance.build_wall_ms=$build_wall_ms | .performance.build_peak_rss_kib=$build_rss | .performance.test_wall_ms=$test_wall_ms | .performance.test_peak_rss_kib=$test_rss | .performance.conformance_wall_ms=$wall_ms | .performance.conformance_peak_rss_kib=$rss' \
            "$evidence/scenarios/normal/ci-artifact.json" > "$RUNNER_TEMP/normal-ci-artifact.json"
          mv "$RUNNER_TEMP/normal-ci-artifact.json" "$evidence/scenarios/normal/ci-artifact.json"
          bash scripts/integration-conform.sh "$GOOO_BIN" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gooo-reflexive-loop-external-inputs" "$evidence/integration"
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%e\t%M' -o "$RUNNER_TEMP/causal-denominator-conformance-time.tsv" \
            bash scripts/causal-denominator-conform.sh "$GOOO_BIN" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gooo-reflexive-loop-external-inputs" "$evidence/causal-denominator"
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns - start_ns) / 1000000 ))
          read -r seconds rss < "$RUNNER_TEMP/causal-denominator-conformance-time.tsv"
          jq -S --argjson wall_ms "$wall_ms" --argjson rss "${rss:-0}" \
            '.performance={conformance_wall_ms:$wall_ms,conformance_peak_rss_kib:$rss}' \
            "$evidence/causal-denominator/causal-denominator-conformance.json" > "$RUNNER_TEMP/causal-denominator-conformance.json"
          mv "$RUNNER_TEMP/causal-denominator-conformance.json" "$evidence/causal-denominator/causal-denominator-conformance.json"

      - name: Check human-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gooo-reflexive-loop-evidence"
          jq -e '
            .schema=="gooo/reflexive-loop/conformance/v1" and
            .tests=={executed:9,reused:0,skipped:0} and
            ([.scenarios[].decision]|sort)==["FAIL_CLOSED","FAIL_CLOSED","FAIL_CLOSED","FAIL_CLOSED","FAIL_CLOSED","FAIL_CLOSED","FAIL_CLOSED","PROMOTED","UNKNOWN"] and
            .performance.conformance_wall_ms >= 0 and .performance.conformance_peak_rss_kib >= 0
          ' "$evidence/conformance.json" >/dev/null
          jq -e '
            .schema=="gooo/reflexive-loop/ci-artifact/v1" and
            .decision=="PROMOTED" and .summary=={total:18,closed:18,unknown:0,refuted:0,direct_missing:0,dependency_blocked:0} and
            .repository_unchanged==true and .repository_writes==0 and
            .artifact.files>0 and .artifact.bytes>0 and
            .performance.before.wall_ms>=0 and .performance.after.wall_ms>=0 and
            (.metrics|length)==18 and .bindings.one_to_one==true
          ' "$evidence/scenarios/normal/ci-artifact.json" >/dev/null
          jq -e 'all(.metrics[]; .denominator==1 and (.numerator|type)=="number" and .activity != null and .source_file=="examples/reflexive-loop/main.gooo" and .ir_node_kind=="Activity" and .generated_artifact != null and .evaluator != null)' "$evidence/scenarios/normal/ci-artifact.json" >/dev/null
          cat "$evidence/scenarios/normal/ci-artifact.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '
            .schema=="gooo/reflexive-loop/integrated-conformance/v1" and
            .tests=={executed:6,reused:0,skipped:0} and
            .cross_project_required_gates==0 and
            .precedence==["REFUTED","UNKNOWN","CLOSED"] and
            ([.scenarios[].decision]|sort)==["CLOSED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED"] and
            .normal_external_unknown.state=="UNKNOWN" and .normal_external_unknown.preserved_exactly==true
          ' "$evidence/integration/integrated-conformance.json" >/dev/null
          jq -e '
            .schema=="gooo/reflexive-loop/integrated-ci-artifact/v1" and
            .scenario=="normal" and .decision=="CLOSED" and
            .summary=={total:8,closed:8,unknown:0,refuted:0} and
            .execution_plan.selected_operation=="reuse-verified-evidence" and
            .execution_plan.deferred_operation=="defer-conformance-replay" and
            .execution_plan.privilege_level=="read-only" and
            .resolution_unknown=={metric:"performance/utility",state:"UNKNOWN",stage:"IMPROVEMENT",step:"REQUIRE_EXACT_BEFORE_AFTER_PAIR",reason:"EXACT_BEFORE_AFTER_PAIR_MISSING",unknown_class:"CAUSALITY_UNPROVEN",next_operation:"PROVIDE_EXACT_BEFORE_AFTER_PAIR",blocked_by:["exact-before-after-pair"],preserved_exactly:true} and
            .lifecycle.promotion=="PROMOTED" and .lifecycle.rollback.repository_writes==0 and
            .authority=={repository_writes:0,cross_project_required_gates:0,input_repository_unchanged:true,local_tests_run:0} and
            .bindings.external_inputs_affect_proposal==true and .bindings.execution_plan_affects_apply==true and
            .bindings.resolution_unknown_affects_utility_claim==true and .bindings.provenance_only==false and
            (.metrics|length)==8 and all(.metrics[]; .denominator==1 and (.numerator|type)=="number")
          ' "$evidence/integration/scenarios/normal/integration-artifact.json" >/dev/null
          cat "$evidence/integration/scenarios/normal/integration-artifact.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$evidence/integration/integrated-conformance.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '
            .schema=="gooo/reflexive-loop/causal-denominator-conformance/v1" and
            .tests=={scenarios:10,normal_selected:{executed:2,reused:1,skipped:1}} and
            .external_required_status_gates==0 and
            .precedence==["REFUTED","UNKNOWN","CLOSED"] and
            ([.scenarios[].decision]|sort)==["CLOSED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","UNKNOWN"] and
            .normal_performance_utility=={state:"UNKNOWN",stage:"IMPROVEMENT",step:"REQUIRE_EXACT_BEFORE_AFTER_PAIR",reason:"EXACT_BEFORE_AFTER_PAIR_MISSING",unknown_class:"CAUSALITY_UNPROVEN",next_operation:"PROVIDE_EXACT_BEFORE_AFTER_PAIR",blocked_by:["exact-before-after-pair"],preserved_exactly:true} and
            .performance.conformance_wall_ms>=0 and .performance.conformance_peak_rss_kib>=0
          ' "$evidence/causal-denominator/causal-denominator-conformance.json" >/dev/null
          jq -e '
            .schema=="gooo/reflexive-loop/causal-denominator-ci-artifact/v1" and
            .scenario=="normal" and .decision=="CLOSED" and
            .summary=={total:10,closed:10,unknown:0,refuted:0} and
            .causal_selection.counts=={execute:2,reuse:1,skip:1} and
            .verification_plan=={mode:"causal-selected-execute-reuse-skip",execute_tests:["test-add","test-integration"],reuse_tests:["test-normalize"],skip_tests:["test-subtract"],proof_contract_version:2,denominator:7} and
            .selected_verification=={execute:2,reuse:1,skip:1,plan_affects_apply:true} and
            .denominator_binding=={v1:6,v2:7,proof_denominator:7,affected_denominator_preserved:true,migration:{added:1,split:1,retired:1}} and
            .lifecycle.promotion=="PROMOTED" and .lifecycle.rollback.repository_writes==0 and
            .authority=={repository_writes:0,external_required_status_gates:0,input_repository_unchanged:true,local_tests_run:0} and
            .bindings.causal_input_affects_proposal==true and .bindings.causal_input_affects_verification_plan==true and
            .bindings.denominator_input_affects_proof_plan==true and .bindings.provenance_only==false and
            (.metrics|length)==10 and all(.metrics[]; .denominator==1 and (.numerator|type)=="number" and .activity != null and .source_file=="examples/reflexive-loop/main.gooo" and .ir_node_kind=="Activity" and .generated_artifact != null and .evaluator != null)
          ' "$evidence/causal-denominator/scenarios/normal/causal-denominator-artifact.json" >/dev/null
          cat "$evidence/causal-denominator/scenarios/normal/causal-denominator-artifact.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$evidence/causal-denominator/causal-denominator-conformance.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload loop evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-reflexive-loop-evidence
          path: ${{ runner.temp }}/gooo-reflexive-loop-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact identity
        run: |
          {
            echo "### Evidence artifact"
            echo "artifact_id: ${{ steps.evidence.outputs.artifact-id }}"
            echo "artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
